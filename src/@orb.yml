version: 2.1

description: |
  Validate commit messages against project guidelines using AI-powered
  analysis from omni-dev. This orb installs the omni-dev CLI tool and
  runs commit message validation as part of your CircleCI pipeline.
  It supports multiple AI providers including Anthropic Claude, OpenAI,
  Ollama for local inference, and AWS Bedrock. Configure commit ranges,
  custom guidelines, output formats, and strict mode to enforce your
  team's commit message standards automatically.

display:
  home_url: https://github.com/rust-works/omni-dev
  source_url: https://github.com/action-works/omni-dev-commit-check-cci

orbs:
  rust: circleci/rust@1.6.1

commands:
  install:
    description: Install the omni-dev CLI tool
    parameters:
      version:
        type: string
        default: "latest"
        description: "omni-dev version to install (e.g., 0.12.0, latest)"
      cache:
        type: boolean
        default: true
        description: "Whether to cache the omni-dev binary"
    steps:
      - when:
          condition: << parameters.cache >>
          steps:
            - restore_cache:
                keys:
                  - omni-dev-{{ arch }}-<< parameters.version >>
      - run:
          name: Install omni-dev
          command: |
            if command -v omni-dev &> /dev/null; then
              echo "omni-dev already installed"
              omni-dev --version
              exit 0
            fi

            VERSION="<< parameters.version >>"
            if [ "$VERSION" = "latest" ]; then
              cargo install omni-dev
            else
              cargo install omni-dev --version "$VERSION"
            fi
      - when:
          condition: << parameters.cache >>
          steps:
            - save_cache:
                key: omni-dev-{{ arch }}-<< parameters.version >>
                paths:
                  - ~/.cargo/bin/omni-dev

  check:
    description: Run commit message validation
    parameters:
      # Provider selection
      use-openai:
        type: boolean
        default: false
        description: "Use OpenAI instead of Anthropic"
      use-ollama:
        type: boolean
        default: false
        description: "Use Ollama for local inference"
      use-bedrock:
        type: boolean
        default: false
        description: "Use AWS Bedrock for Claude"

      # Model configuration
      model:
        type: string
        default: ""
        description: "AI model to use (e.g., claude-sonnet-4-5-20250929)"

      # Ollama-specific
      ollama-base-url:
        type: string
        default: ""
        description: "Ollama server URL (default: http://localhost:11434)"
      ollama-model:
        type: string
        default: ""
        description: "Ollama model name"

      # Bedrock-specific
      bedrock-base-url:
        type: string
        default: ""
        description: "AWS Bedrock endpoint URL"

      # Commit range configuration
      commit-range:
        type: string
        default: ""
        description: "Commit range to check (e.g., HEAD~5..HEAD)"
      base-branch:
        type: string
        default: ""
        description: "Base branch to compare against (defaults to main/master)"

      # Guidelines configuration
      guidelines:
        type: string
        default: ""
        description: "Path to custom commit guidelines file"
      context-dir:
        type: string
        default: ".omni-dev/"
        description: "Custom context directory for loading guidelines"

      # Output configuration
      format:
        type: enum
        enum: ["text", "json", "yaml"]
        default: "text"
        description: "Output format"

      # Behavior configuration
      strict:
        type: boolean
        default: false
        description: "Exit with error code if any warnings found"
      quiet:
        type: boolean
        default: false
        description: "Only show errors/warnings, suppress info-level output"
      verbose:
        type: boolean
        default: false
        description: "Show detailed analysis including model info"
      show-passing:
        type: boolean
        default: false
        description: "Include passing commits in output"
      no-suggestions:
        type: boolean
        default: false
        description: "Skip generating corrected message suggestions"

      # Performance configuration
      batch-size:
        type: integer
        default: 4
        description: "Number of commits to process per AI request"

    steps:
      - run:
          name: Run commit message check
          command: |
            # Build command arguments
            ARGS=()

            # Add optional flags
            if [ "<< parameters.strict >>" = "true" ]; then
              ARGS+=("--strict")
            fi

            if [ "<< parameters.quiet >>" = "true" ]; then
              ARGS+=("--quiet")
            fi

            if [ "<< parameters.verbose >>" = "true" ]; then
              ARGS+=("--verbose")
            fi

            if [ "<< parameters.show-passing >>" = "true" ]; then
              ARGS+=("--show-passing")
            fi

            if [ "<< parameters.no-suggestions >>" = "true" ]; then
              ARGS+=("--no-suggestions")
            fi

            # Add optional parameters
            MODEL="<< parameters.model >>"
            if [ -n "$MODEL" ]; then
              ARGS+=("--model" "$MODEL")
            fi

            GUIDELINES="<< parameters.guidelines >>"
            if [ -n "$GUIDELINES" ]; then
              ARGS+=("--guidelines" "$GUIDELINES")
            fi

            CONTEXT_DIR="<< parameters.context-dir >>"
            if [ -n "$CONTEXT_DIR" ]; then
              ARGS+=("--context-dir" "$CONTEXT_DIR")
            fi

            ARGS+=("--format" "<< parameters.format >>")
            ARGS+=("--batch-size" "<< parameters.batch-size >>")

            # Add commit range if specified
            COMMIT_RANGE="<< parameters.commit-range >>"
            BASE_BRANCH="<< parameters.base-branch >>"

            if [ -n "$COMMIT_RANGE" ]; then
              ARGS+=("$COMMIT_RANGE")
            elif [ -n "$BASE_BRANCH" ]; then
              ARGS+=("$BASE_BRANCH..HEAD")
            elif [ -n "$CIRCLE_BRANCH" ] && \
                 [ "$CIRCLE_BRANCH" != "main" ] && \
                 [ "$CIRCLE_BRANCH" != "master" ]; then
              # Try to detect base branch in PR context
              if git rev-parse --verify origin/main &>/dev/null; then
                ARGS+=("origin/main..HEAD")
              elif git rev-parse --verify origin/master &>/dev/null; then
                ARGS+=("origin/master..HEAD")
              fi
            fi

            # Set provider-specific environment variables
            if [ "<< parameters.use-openai >>" = "true" ]; then
              export USE_OPENAI=true
            fi

            if [ "<< parameters.use-ollama >>" = "true" ]; then
              export USE_OLLAMA=true
              OLLAMA_URL="<< parameters.ollama-base-url >>"
              if [ -n "$OLLAMA_URL" ]; then
                export OLLAMA_BASE_URL="$OLLAMA_URL"
              fi
              OLLAMA_MDL="<< parameters.ollama-model >>"
              if [ -n "$OLLAMA_MDL" ]; then
                export OLLAMA_MODEL="$OLLAMA_MDL"
              fi
            fi

            if [ "<< parameters.use-bedrock >>" = "true" ]; then
              export CLAUDE_CODE_USE_BEDROCK=true
              BEDROCK_URL="<< parameters.bedrock-base-url >>"
              if [ -n "$BEDROCK_URL" ]; then
                export ANTHROPIC_BEDROCK_BASE_URL="$BEDROCK_URL"
              fi
            fi

            # Run the check command
            omni-dev git commit message check "${ARGS[@]}"

jobs:
  commit-check:
    description: |
      Run AI-powered commit message validation. Requires ANTHROPIC_API_KEY,
      OPENAI_API_KEY, or appropriate provider credentials to be set as
      environment variables in CircleCI project settings.
    parameters:
      # Executor configuration
      executor:
        type: executor
        default: default
        description: "Executor to use for the job"

      # Version configuration
      version:
        type: string
        default: "latest"
        description: "omni-dev version to install"

      # All check parameters
      use-openai:
        type: boolean
        default: false
      use-ollama:
        type: boolean
        default: false
      use-bedrock:
        type: boolean
        default: false
      model:
        type: string
        default: ""
      ollama-base-url:
        type: string
        default: ""
      ollama-model:
        type: string
        default: ""
      bedrock-base-url:
        type: string
        default: ""
      commit-range:
        type: string
        default: ""
      base-branch:
        type: string
        default: ""
      guidelines:
        type: string
        default: ""
      context-dir:
        type: string
        default: ".omni-dev/"
      format:
        type: enum
        enum: ["text", "json", "yaml"]
        default: "text"
      strict:
        type: boolean
        default: false
      quiet:
        type: boolean
        default: false
      verbose:
        type: boolean
        default: false
      show-passing:
        type: boolean
        default: false
      no-suggestions:
        type: boolean
        default: false
      batch-size:
        type: integer
        default: 4

    executor: << parameters.executor >>
    steps:
      - checkout
      - rust/install
      - install:
          version: << parameters.version >>
      - check:
          use-openai: << parameters.use-openai >>
          use-ollama: << parameters.use-ollama >>
          use-bedrock: << parameters.use-bedrock >>
          model: << parameters.model >>
          ollama-base-url: << parameters.ollama-base-url >>
          ollama-model: << parameters.ollama-model >>
          bedrock-base-url: << parameters.bedrock-base-url >>
          commit-range: << parameters.commit-range >>
          base-branch: << parameters.base-branch >>
          guidelines: << parameters.guidelines >>
          context-dir: << parameters.context-dir >>
          format: << parameters.format >>
          strict: << parameters.strict >>
          quiet: << parameters.quiet >>
          verbose: << parameters.verbose >>
          show-passing: << parameters.show-passing >>
          no-suggestions: << parameters.no-suggestions >>
          batch-size: << parameters.batch-size >>

executors:
  default:
    description: Default executor using CircleCI's base image with Rust
    docker:
      - image: cimg/rust:1.83
    resource_class: medium
