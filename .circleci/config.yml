version: 2.1

orbs:
  orb-tools: circleci/orb-tools@12.1

filters: &filters
  tags:
    only: /.*/

release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

workflows:
  lint-pack:
    jobs:
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          filters: *filters
      - orb-tools/publish:
          orb_name: action-works/omni-dev-commit-check
          vcs_type: << pipeline.project.type >>
          pub_type: dev
          requires:
            - orb-tools/lint
            - orb-tools/review
            - orb-tools/pack
          context: orb-publishing
          filters: *filters

  release:
    jobs:
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: action-works/omni-dev-commit-check
          vcs_type: << pipeline.project.type >>
          pub_type: production
          requires:
            - orb-tools/pack
          context: orb-publishing
          filters: *release-filters
