version: 2.1

orbs:
  orb-tools: circleci/orb-tools@12.1
  # Use the dev version of the orb for integration testing
  # This references the dev orb published by orb-tools/publish in this workflow
  omni-dev: action-works/omni-dev-commit-check@dev:alpha

filters: &filters
  tags:
    only: /.*/

release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

workflows:
  lint-pack:
    jobs:
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          filters: *filters
      - orb-tools/publish:
          orb_name: action-works/omni-dev-commit-check
          vcs_type: github
          pub_type: dev
          requires:
            - orb-tools/lint
            - orb-tools/review
            - orb-tools/pack
          context: orb-publishing
          filters: *filters
      # Use the orb itself to validate commit messages (PRs only)
      - omni-dev/commit-check:
          name: commit-check
          verbose: true
          model: claude-sonnet-4-5-20250929
          context: anthropic-credentials
          filters:
            branches:
              ignore:
                - main
                - master

